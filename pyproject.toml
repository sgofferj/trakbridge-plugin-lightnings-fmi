[tool.poetry]
name = "trakbridge-plugin-lightnings-fmi"
version = "0.2.0"
description = "Finnish Meteorological Institute Lightning plugin for TrakBridge"
authors = ["Stefan Gofferje <stefan@gofferje.net>"]
license = "GPL-3.0-or-later"
packages = [{include = "plugin"}]

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.9.0"
trakbridge-plugin-sdk = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
mypy = "^1.8.0"
pylint = "^3.0.0"
pyyaml = "*"
pip-audit = "^2.7.0"
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = "venv"
disallow_subclassing_any = false
explicit_package_bases = true
mypy_path = "."

[tool.pylint.messages_control]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "too-many-locals",
]

[tool.pylint.format]
max-line-length = 100
